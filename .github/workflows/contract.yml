name: contract
on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: pytest tests/contract -v
        env:
          IGP_CONTRACT_TESTS: "1"
