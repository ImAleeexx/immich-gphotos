{% extends "base.html" %}
{% set nav_active = "failures" %}
{% block content %}
<h1>Failures</h1>
<table>
  <thead>
    <tr><th>Filename</th><th>Attempts</th><th>Error</th><th>Message</th><th></th></tr>
  </thead>
  <tbody id="rows"><tr><td colspan="5">Loading…</td></tr></tbody>
</table>
<script>
  function cell(text) {
    const td = document.createElement("td");
    td.textContent = text;
    return td;
  }

  async function load() {
    const rows = document.getElementById("rows");
    const failures = await (await fetch("/api/failures")).json();
    rows.replaceChildren();
    if (!failures.length) {
      const tr = document.createElement("tr");
      tr.appendChild(cell("No failures."));
      tr.lastChild.colSpan = 5;
      rows.appendChild(tr);
      return;
    }
    for (const f of failures) {
      // filename is Immich's originalFileName and last_error is arbitrary
      // Google/gpmc error text -- both are attacker-influenceable, so every
      // field here goes through textContent, never innerHTML.
      const tr = document.createElement("tr");
      tr.appendChild(cell(f.filename));
      tr.appendChild(cell(f.attempts));
      tr.appendChild(cell(f.error_class ?? "-"));
      tr.appendChild(cell(f.last_error ?? "-"));

      const actionTd = document.createElement("td");
      const button = document.createElement("button");
      button.type = "button";
      button.className = "retry";
      button.textContent = "Retry";
      button.dataset.id = f.immich_id;
      button.addEventListener("click", async () => {
        await fetch(`/api/failures/${encodeURIComponent(button.dataset.id)}/retry`, { method: "POST" });
        load();
      });
      actionTd.appendChild(button);
      tr.appendChild(actionTd);

      rows.appendChild(tr);
    }
  }
  load();
</script>
{% endblock %}
