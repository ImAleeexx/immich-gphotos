{% extends "base.html" %}
{% block content %}
<h1>Failures</h1>
<table>
  <thead>
    <tr><th>Filename</th><th>Attempts</th><th>Error</th><th>Message</th><th></th></tr>
  </thead>
  <tbody id="rows"><tr><td colspan="5">Loading…</td></tr></tbody>
</table>
<script>
  async function load() {
    const rows = document.getElementById("rows");
    const failures = await (await fetch("/api/failures")).json();
    if (!failures.length) {
      rows.innerHTML = "<tr><td colspan=\"5\">No failures.</td></tr>";
      return;
    }
    rows.innerHTML = failures.map((f) => `
      <tr>
        <td>${f.filename}</td>
        <td>${f.attempts}</td>
        <td>${f.error_class ?? "-"}</td>
        <td>${f.last_error ?? "-"}</td>
        <td><button data-id="${f.immich_id}" class="retry">Retry</button></td>
      </tr>`).join("");
    rows.querySelectorAll(".retry").forEach((btn) => {
      btn.addEventListener("click", async () => {
        await fetch(`/api/failures/${btn.dataset.id}/retry`, { method: "POST" });
        load();
      });
    });
  }
  load();
</script>
{% endblock %}
