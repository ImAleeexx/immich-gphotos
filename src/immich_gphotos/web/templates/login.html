{% extends "base.html" %}
{% set show_chrome = false %}
{% block content %}
<form method="post" action="/login" class="card">
  {% if first_run %}
    <h1>Welcome</h1>
    <p>Set a password to protect this dashboard. It stores your Google and Immich
       credentials, so it is not left open.</p>
  {% else %}
    <h1>Sign in</h1>
  {% endif %}
  <input type="password" name="password" autofocus required>
  <button type="submit">{{ "Set password" if first_run else "Sign in" }}</button>
</form>
{% endblock %}
